.hd>*{position:relative}
#auth{position:fixed;inset:0;z-index:100;background:var(--sf);display:flex;flex-direction:column;overflow-y:auto}
#auth[hidden]{display:none}
.ac{flex:1;display:grid;place-items:start center;padding:36px 16px}
.acard{width:min(440px,100%);background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,20,50,.12)}
.acard h2{margin:0 0 4px;font:400 26px/1.2 "Source Serif 4",Georgia,serif}
.atabs{display:flex;gap:6px;background:var(--sf);border-radius:12px;padding:4px;margin:18px 0 16px}
.atabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--mu)}
.atabs button.on{background:var(--bg);color:var(--br);box-shadow:0 1px 4px rgba(0,20,50,.14)}
.af{display:flex;flex-direction:column;gap:12px}
.af[hidden]{display:none}
.af label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--mu)}
.af input{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;font-weight:400}
.af input:focus{outline:0;border-color:var(--azul)}
.apri{background:var(--azul);color:#fff;border:0;border-radius:12px;padding:11px;font-weight:600;font-size:15px}
.apri:disabled{opacity:.6}
.amsg{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.amsg[hidden]{display:none}
.amsg.err{background:rgba(216,25,32,.1);color:var(--verm)}
.amsg.ok{background:rgba(0,90,158,.12);color:var(--br)}
.mt{color:var(--mu);font-size:13px}
.hd{height:52px;padding:0 9px}
:root[data-theme="dark"]{--bg:#0E1620;--sf:#16212D;--ln:#263445;--tx:#EAF0F6;--mu:#93A1B3;--br:#5AA6E8;color-scheme:dark}
</style>
</head>
<body>
<div id="auth">
 <div class="hd"></div>
 <div class="ac">
  <div class="acard">
   <h2>Inteligência Comercial</h2>
   <div class="mt">Acesso restrito a usuários autorizados.</div>
   <div class="atabs"><button type="button" class="on" data-at="login">Entrar</button><button type="button" data-at="cad">Solicitar acesso</button></div>
   <div id="amsg" class="amsg" role="alert" hidden></div>
   <div id="a-login" class="af">
    <label>E-mail<input id="l-email" type="email" autocomplete="username"></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password"></label>
    <button type="button" class="apri" id="b-login">Entrar</button>
   </div>
   <div id="a-cad" class="af" hidden>
    <label>Nome completo<input id="c-nome" autocomplete="name"></label>
    <label>E-mail corporativo<input id="c-email" type="email" autocomplete="email"></label>
    <label>Cargo / setor<input id="c-cargo"></label>
    <label>Senha (mínimo de 8 caracteres)<input id="c-senha" type="password" autocomplete="new-password"></label>
    <label>Confirmar senha<input id="c-conf" type="password" autocomplete="new-password"></label>
    <button type="button" class="apri" id="b-cad">Solicitar acesso</button>
    <div class="mt">Seu cadastro será analisado por um administrador. Você só poderá entrar depois de aprovado.</div>
   </div>
  </div>
 </div>
</div>
<script>
const API_BASE='';                     
const APP_URL='inteligencia-comercial.html'; 
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const token=()=>{try{return localStorage.getItem('token')||''}catch(e){return ''}};
const AVISOS={saiu:['Você saiu do sistema.','ok'],expirou:['Sua sessão expirou. Entre novamente.','err'],nao_autorizado:['Seu acesso não está autorizado.','err']};
const STATUS_MSG={pendente:'Seu cadastro está aguardando aprovação de um administrador.',recusado:'Seu acesso não foi autorizado. Procure o administrador do sistema.',bloqueado:'Seu acesso está bloqueado. Procure o administrador do sistema.'};
function msgA(t,tipo){const m=$('#amsg');m.hidden=!t;m.className='amsg '+(tipo||'err');m.textContent=t||''}
function abaA(k){$$('.atabs button').forEach(b=>b.classList.toggle('on',b.dataset.at===k));$('#a-login').hidden=k!=='login';$('#a-cad').hidden=k!=='cad';msgA('')}
async function post(path,body){try{const r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,status:r.status,d}}catch(e){return{ok:false,status:0,d:null}}}
async function login(){
 const email=$('#l-email').value.trim(),senha=$('#l-senha').value;
 if(!email||!senha)return msgA('Informe e-mail e senha.');
 const b=$('#b-login');b.disabled=true;msgA('');
 const r=await post('/api/auth/login',{email,senha});b.disabled=false;
 if(r.ok&&r.d&&r.d.token){try{localStorage.setItem('token',r.d.token)}catch(e){}location.href=APP_URL;return}
 msgA(r.status===0?'Não foi possível conectar ao servidor.':r.status===401?'E-mail ou senha incorretos.':r.status===403?(STATUS_MSG[r.d&&r.d.status]||'Seu acesso não está autorizado.'):'Não foi possível entrar. Tente novamente.')}
async function cadastrar(){
 const v=id=>$(id).value.trim(),nome=v('#c-nome'),email=v('#c-email'),cargo=v('#c-cargo'),senha=$('#c-senha').value,conf=$('#c-conf').value;
 if(!nome||!email||!cargo||!senha)return msgA('Preencha todos os campos.');
 if(!/^\S+@\S+\.\S+$/.test(email))return msgA('Informe um e-mail válido.');
 if(senha.length<8)return msgA('A senha precisa ter pelo menos 8 caracteres.');
 if(senha!==conf)return msgA('As senhas não conferem.');
 const b=$('#b-cad');b.disabled=true;msgA('');
 const r=await post('/api/auth/cadastro',{nome,email,cargo,senha});b.disabled=false;
 if(r.ok){['#c-nome','#c-email','#c-cargo','#c-senha','#c-conf'].forEach(s=>$(s).value='');abaA('login');$('#l-email').value=email;return msgA('Cadastro enviado! Um administrador precisa aprovar seu acesso antes do primeiro login.','ok')}
 msgA(r.status===0?'Não foi possível conectar ao servidor.':r.status===409?'Este e-mail já está cadastrado.':'Não foi possível enviar o cadastro. Tente novamente.')}
$$('.atabs button').forEach(b=>b.onclick=()=>abaA(b.dataset.at));
$('#b-login').onclick=login;$('#b-cad').onclick=cadastrar;
$('#auth').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();($('#a-login').hidden?cadastrar:login)()}});
const aviso=AVISOS[new URLSearchParams(location.search).get('msg')];
if(aviso)msgA(aviso[0],aviso[1]);
else if(token())location.href=APP_URL;  
</script>
</body>
</html>
